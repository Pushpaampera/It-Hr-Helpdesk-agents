[tool.poetry]
name = "helpdesk-ai-agents"
version = "0.1.0"
description = "Enterprise IT/HR helpdesk run by cooperating AI agents, with real RAG over pgvector"
authors = ["Helpdesk AI Agents"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "0.115.0"
uvicorn = {extras = ["standard"], version = "0.30.6"}
sqlalchemy = "2.0.35"
psycopg = {extras = ["binary"], version = "3.2.1"}
pgvector = "0.3.2"
pydantic = "2.9.2"
pydantic-settings = "2.5.2"
python-jose = {extras = ["cryptography"], version = "3.3.0"}
passlib = {extras = ["bcrypt"], version = "1.7.4"}
bcrypt = "4.0.1"
sse-starlette = "2.1.3"
numpy = "1.26.4"
python-dotenv = "1.0.1"
tenacity = ">=8.1.0,<9.0.0"
prometheus-client = "0.21.0"
langgraph = "0.2.34"
langchain-core = "0.3.10"
groq = "0.11.0"
google-genai = "0.2.2"
sentence-transformers = "3.1.1"
python-multipart = "0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.3"
pytest-asyncio = "0.24.0"
httpx = "0.27.2"

[tool.poetry.scripts]
migrate = "app.cli:migrate"
seed = "app.cli:seed"
reset-demo = "app.seed.generators.demo_data:main"
simulate-feedback = "app.cli:simulate_feedback"
search = "app.cli:search"
eval = "app.cli:run_eval_cmd"
dev = "app.cli:dev"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
